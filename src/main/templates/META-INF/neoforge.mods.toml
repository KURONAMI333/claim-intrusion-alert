modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="${mod_authors}"
description='''
${mod_description}
'''

# No [[mixins]]: Claim Intrusion Alert listens to vanilla BlockEvent /
# PlayerInteractEvent and asks the claim mod whether the action would be
# blocked (FTB Chunks public API / OPAC via reflection). It never cancels
# anything itself.

# NOTE: versionRange uses neo_version, NOT loader_version_range
# (composing the loader range here yields an unparseable range and
# silently breaks the mod — lesson carried from Free Server Saver).
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Both claim mods are optional: either one alone is enough, and with neither
# installed the mod just stays idle. versionRange is deliberately wide — this
# is an add-on and the host mods use compound version strings that break
# narrow ranges.
[[dependencies.${mod_id}]]
    modId="ftbchunks"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="openpartiesandclaims"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
