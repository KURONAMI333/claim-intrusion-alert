modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

# No [[mixins]]: Claim Intrusion Alert listens to vanilla BlockEvent /
# PlayerInteractEvent at HIGHEST priority and calls FTB Chunks public API.

# NOTE: versionRange uses neo_version, NOT loader_version_range
# (composing the loader range here yields an unparseable range and
# silently breaks the mod — lesson carried from Free Server Saver).
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ftbchunks"
    type="required"
    versionRange="[2101,)"
    ordering="AFTER"
    side="BOTH"
