mod_description=When someone tries to break, place or use a block inside a claim they do not belong to, the claim owner and their team or party get a chat alert with the intruder name, coordinates and action. Works with FTB Chunks and Open Parties and Claims; either one is enough. Both mods only tell the intruder, never the owner.

# FTB Chunks dependency (1.21.1). SPEC Q4 named 2101.1.21 / 2101.1.34 (maven-metadata.xml
# latest), but those were built with Fabric Loom 1.17.491 / 1.10.437 — chunks 2101.1.21 fails
# this project's pinned Loom (1.10.5) at remap time ("Mod was built with a newer version of
# Loom"; Loom's own check only compares major.minor, so minor 17 > 10 hard-fails). 2101.1.20
# is the newest build still on Loom 1.7.x / 1.10.x, which resolves cleanly.
ftb_chunks_version=2101.1.20
ftb_library_version=2101.1.20
