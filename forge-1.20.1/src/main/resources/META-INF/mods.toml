# Claim Intrusion Alert - Forge 1.20.1 mods.toml
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="${mod_authors}"
displayURL="https://github.com/KURONAMI333/claim-intrusion-alert"
issueTrackerURL="https://github.com/KURONAMI333/claim-intrusion-alert/issues"
description='''
${mod_description}
'''

# No [[mixins]]: Claim Intrusion Alert listens to vanilla BlockEvent /
# PlayerInteractEvent and asks the claim mod whether the action would be
# blocked (FTB Chunks public API / OPAC via reflection). It never cancels
# anything itself.

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Both claim mods are optional: either one alone is enough, and with neither
# installed the mod just stays idle. versionRange is deliberately wide — this
# is an add-on and the host mods use compound version strings that break
# narrow ranges.
[[dependencies.${mod_id}]]
    modId="ftbchunks"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="openpartiesandclaims"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
