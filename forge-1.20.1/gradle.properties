# Claim Intrusion Alert - Forge 1.20.1 build
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 1.20.1 = Java 17. System JAVA_HOME is JDK 25 (too new for ForgeGradle) — pin JDK 17.
org.gradle.java.home=C:/Program Files/Java/jdk-17

# ─── Minecraft / Forge ──────────────────────────────────────────
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.13
forge_version_range=[47,)
loader_version_range=[47,)

# ─── Parchment ─────────────────────────────────────────────────
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# ─── Mod metadata ──────────────────────────────────────────────
mod_id=claimintrusionalert
mod_name=Claim Intrusion Alert
mod_license=MIT
mod_version=0.2.0
mod_group_id=com.kuronami.claimintrusionalert
mod_authors=KURONAMI
mod_description=When someone tries to break, place or use a block inside a claim they do not belong to, the claim owner and their team or party get a chat alert with the intruder name, coordinates and action. Works with FTB Chunks and Open Parties and Claims; either one is enough. Both mods only tell the intruder, never the owner.

# FTB Chunks dependency (1.20.1)
ftb_chunks_version=2001.3.8
ftb_library_version=2001.2.13
