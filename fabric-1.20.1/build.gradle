plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojang official mappings: same net.minecraft.* names as Forge/NeoForge,
    // so the loader-agnostic logic copies verbatim.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // FTB Chunks (soft dependency) — claim/team API + ChunkDimPos.
    // transitive = false: ftb-chunks-fabric / ftb-library-fabric pull in JEI and other
    // third-party maven coordinates we have no repository for and do not need (we only
    // touch the claim/team API classes). compileOnly only: nothing is bundled into the published jar.
    modCompileOnly("dev.ftb.mods:ftb-chunks-fabric:${ftb_chunks_version}") { transitive = false }
    modCompileOnly("dev.ftb.mods:ftb-library-fabric:${ftb_library_version}") { transitive = false }

    // modLocalRuntime は置かない: FTB Chunks / FTB Library だけを推移依存なしで dev ランタイムへ
    // 入れると architectury / ftbteams が欠けて Fabric Loader の解決が落ち、dev server が起動
    // しなくなる（soft dependency なので dev ランタイムに居る必要もない）。

    // Open Parties and Claims (soft dependency) — 公開 maven が無いので依存を持たず、
    // OpacProvider が完全にリフレクションで叩く。ここに足すものは無い。
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": minecraft_version,
                "loader_version": loader_version,
                "fabric_version": fabric_version,
                "mod_id": mod_id,
                "mod_name": mod_name,
                "mod_description": mod_description,
                "mod_authors": mod_authors,
                "mod_license": mod_license
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_id}" }
    }
}
